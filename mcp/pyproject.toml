[project]
name = "meehawk-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "google-adk>=1.0",
    "python-dotenv>=1.0",
]

[project.scripts]
meehawk-mcp = "server:main"

[tool.hatch.build.targets.wheel]
include = ["server.py", "match_state.py", "rules.py", "annotation.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
