<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MeeHawk — Wireframe match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Google+Sans:wght@400;500;600;700&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #EDE6D6; }
  * { box-sizing: border-box; }
  @keyframes meeHawkPulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.9; }
    50%      { transform: translate(-50%, -50%) scale(1.15); opacity: 0.5; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="design-system.jsx"></script>
<script type="text/babel" src="wireframes.jsx"></script>

<script type="text/babel">
/* global DesignCanvas, DCSection, DCArtboard, DCPostIt, IOSDevice, MH, HandLabel, MonoLabel, Chip, BallIcon,
          Screen, Legend, GestureCard, W */

function PhoneFrame({ children }) {
  return (
    <IOSDevice width={W.w} height={W.h}>
      <div style={{ position: 'absolute', inset: 0, paddingTop: 48 }}>
        {children}
      </div>
    </IOSDevice>
  );
}

function App() {
  return (
    <DesignCanvas style={{ background: '#EDE6D6' }}>
      <DCSection title="MeeHawk · annotations gestuelles" subtitle="3 états clés de l'écran de match · terrain paysage · sans zones">
        <DCArtboard label="1. Service — tracer la trajectoire">
          <PhoneFrame><Screen mode="serve"/></PhoneFrame>
        </DCArtboard>
        <DCArtboard label="2. Point gagnant — long-press adverse → pop-up attaque">
          <PhoneFrame><Screen mode="attack"/></PhoneFrame>
        </DCArtboard>
        <DCArtboard label="3. Faute — long-press joueur → pop-up faute">
          <PhoneFrame><Screen mode="fault"/></PhoneFrame>
        </DCArtboard>
        <DCArtboard label="4. Repositionner — long-press maintenu + glisse">
          <PhoneFrame><Screen mode="reposition"/></PhoneFrame>
        </DCArtboard>

        <DCArtboard label="Gestes">
          <GestureCard/>
        </DCArtboard>

        <DCArtboard label="Légende">
          <Legend/>
        </DCArtboard>

        <DCPostIt top={-10} right={-40} rotate={3} width={220}>
          Plus de zones pré-définies. Tout passe par 3 gestes : trace, appui long adv, appui long nous.
        </DCPostIt>
      </DCSection>

      <DCSection title="Timeline du set" subtitle="2 lignes parallèles · point du côté du gagnant de l'échange · tap = replay du point">
        <DCArtboard label="A. Bars — pleines vs pointillés">
          <PhoneFrame><Screen mode="serve" timeline="bars"/></PhoneFrame>
        </DCArtboard>
        <DCArtboard label="B. Dots — pastilles, plus aéré">
          <PhoneFrame><Screen mode="serve" timeline="dots"/></PhoneFrame>
        </DCArtboard>
        <DCArtboard label="C. Ticks — axe central, haut/bas">
          <PhoneFrame><Screen mode="serve" timeline="ticks"/></PhoneFrame>
        </DCArtboard>
        <DCArtboard label="D. Stacked — 1 slot partagé par échange">
          <PhoneFrame><Screen mode="serve" timeline="stacked"/></PhoneFrame>
        </DCArtboard>

        <DCArtboard label="E. Tap sur un point → replay de l'échange">
          <PhoneFrame><Screen mode="serve" timeline="bars" replay={true}/></PhoneFrame>
        </DCArtboard>

        <DCPostIt top={20} right={-30} rotate={-2} width={230}>
          Lecture : chaque colonne = 1 échange. Tap sur un point → replay textuel dans la zone au-dessus du compteur (annotations + notes manuelles du set).
        </DCPostIt>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
