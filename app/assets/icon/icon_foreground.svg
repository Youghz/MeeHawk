<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 36 36" width="1024" height="1024">
  <!-- Carapace (crab body = volleyball ellipse) -->
  <ellipse cx="12" cy="15" rx="8.5" ry="6" fill="none" stroke="#FF5C26" stroke-width="2"/>
  <!-- Volleyball seams on carapace -->
  <path d="M 4 12 C 7 14 12 14 20 12" fill="none" stroke="#FF5C26" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M 7.5 21 C 6.5 17.5 8.5 13 12 9" fill="none" stroke="#FF5C26" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M 20.5 16.5 C 17 15.5 11 17 7.5 21" fill="none" stroke="#FF5C26" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Left eye stalk + eye -->
  <line x1="9" y1="9" x2="7" y2="5" stroke="#FF5C26" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="6.5" cy="3.5" r="2.1" fill="#FF5C26"/>
  <!-- Right eye stalk + eye -->
  <line x1="15" y1="9" x2="17" y2="5" stroke="#FF5C26" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="17.5" cy="3.5" r="2.1" fill="#FF5C26"/>
  <!-- Left claw: arm → junction → two pincer fingers -->
  <path d="M 3.5 13 C 0.5 10.5 -1 8 -1.5 5.5" fill="none" stroke="#FF5C26" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M -1.5 5.5 C -3.5 2 -2 -0.5 0 1" fill="none" stroke="#FF5C26" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M -1.5 5.5 C -3.5 7.5 -2.5 11 -0.5 10" fill="none" stroke="#FF5C26" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Right claw: arm → junction → two pincer fingers -->
  <path d="M 20.5 13 C 23.5 10.5 25 8 25.5 5.5" fill="none" stroke="#FF5C26" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 25.5 5.5 C 27.5 2 26 -0.5 24 1" fill="none" stroke="#FF5C26" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 25.5 5.5 C 27.5 7.5 26.5 11 24.5 10" fill="none" stroke="#FF5C26" stroke-width="1.8" stroke-linecap="round"/>
</svg>
