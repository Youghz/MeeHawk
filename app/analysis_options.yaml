include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - .dart_tool/**
    - android/**
    - ios/**
    - web/**
    - macos/**

linter:
  rules:
    # Applications don't need doc comments on every public widget/constructor —
    # this rule fits libraries published on pub.dev, not app code.
    public_member_api_docs: false
    # Flutter widget trees are naturally deep; 80 chars is too tight.
    # very_good_analysis already allows specific exceptions, but we relax
    # it uniformly and format for readability instead.
    lines_longer_than_80_chars: false
