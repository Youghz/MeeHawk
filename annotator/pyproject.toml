[project]
name = "meehawk-annotator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "google-cloud-firestore>=2.27.0",
    "firebase-admin>=6.5.0",
    "rich>=13.0",
    "pydantic>=2.0",
    "mcp>=1.0",
]

[project.scripts]
meehawk-mcp = "annotator.mcp_server:main"
meehawk-annotate = "annotator.agent:main"
meehawk-benchmark = "annotator.benchmark:main"

[tool.hatch.build.targets.wheel]
packages = ["annotator"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
